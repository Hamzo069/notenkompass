name: Windows-Build (Tauri)

# Baut die Desktop-Version von Notenkompass für Windows (.exe/.msi-Installer).
# - Automatisch bei jedem Release (Tag "v*"), Ergebnis wird an den GitHub-Release angehängt.
# - Manuell jederzeit über "Run workflow" (Actions-Tab), Ergebnis als Artefakt zum Download.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Dependencies cachen
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node.js einrichten (für die Tauri-CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tauri-CLI installieren
        run: npm install --no-save @tauri-apps/cli@2

      - name: Windows-Installer bauen
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          npx tauri build --verbose 2>&1 | Tee-Object -FilePath build-log.txt
          exit $LASTEXITCODE

      # Debug-Hilfe: bei einem Fehlschlag das Ende des Build-Logs in ein Tracking-Issue
      # posten, da die rohen Action-Logs nicht überall abrufbar sind.
      - name: "Bei Fehler: Log-Ausschnitt posten"
        if: steps.build.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tail = Get-Content build-log.txt -Tail 250 -ErrorAction SilentlyContinue | Out-String
          if ([string]::IsNullOrWhiteSpace($tail)) { $tail = "(build-log.txt war leer oder fehlte)" }
          $body = "Build fehlgeschlagen - Run " + "${{ github.run_id }}" + " (" + "${{ github.event_name }}" + ")." + "`n`n" + '```' + "`n$tail`n" + '```'
          gh issue comment 19 --repo "${{ github.repository }}" --body $body

      - name: Log immer als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Build-Status auswerten
        if: steps.build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: notenkompass-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Nur bei einem Versions-Tag (z.B. "v1.0.0"): Installer an einen Release-Entwurf anhängen.
      - name: Installer an Release-Entwurf anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Notenkompass ${{ github.ref_name }}" --draft --notes "Automatisch gebauter Windows-Installer." 2>$null
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi --clobber
