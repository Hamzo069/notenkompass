name: Windows-Build (Tauri)

# Baut die Desktop-Version von Notenkompass für Windows (.exe/.msi-Installer).
# - Automatisch bei jedem Release (Tag "v*"), Ergebnis wird an den GitHub-Release angehängt.
# - Manuell jederzeit über "Run workflow" (Actions-Tab), Ergebnis als Artefakt zum Download.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Toolchain installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Dependencies cachen
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node.js einrichten (für die Tauri-CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tauri-CLI installieren
        run: npm install --no-save @tauri-apps/cli@2

      # Bei einem Versions-Tag (z.B. "v1.0.0"): bauen UND als Entwurf-Release anhängen.
      - name: Windows-Installer bauen + Release-Entwurf befüllen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notenkompass ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      # Bei manuellem Start (workflow_dispatch): nur bauen, kein Release anfassen.
      - name: Windows-Installer bauen (nur Artefakt)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: notenkompass-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
