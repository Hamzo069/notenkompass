[package]
name = "notenkompass"
version = "0.1.0"
description = "Notenkompass - freies, lokales Noten-Tracking-Tool"
authors = ["Notenkompass contributors"]
license = "MIT"
repository = "https://github.com/Hamzo069/notenkompass"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
